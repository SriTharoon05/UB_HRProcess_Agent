# Use behind an HTTPS ingress. Never expose Redis or the API directly.
# Required: backend/.env with connected integration settings and a public HTTPS URL.
services:
  api:
    env_file: ./backend/.env
    environment:
      APP_ENV: production
      DEMO_MODE: 'false'
      FRONTEND_BASE_URL: ${TALENTMATCH_PUBLIC_URL:?Set TALENTMATCH_PUBLIC_URL to your public HTTPS origin}
      BACKEND_BASE_URL: ${TALENTMATCH_PUBLIC_URL:?Set TALENTMATCH_PUBLIC_URL to your public HTTPS origin}
      CORS_ALLOWED_ORIGINS: '["${TALENTMATCH_PUBLIC_URL:?Set TALENTMATCH_PUBLIC_URL to your public HTTPS origin}"]'
      REDIS_URL: redis://redis:6379/0
  worker:
    environment:
      APP_ENV: production
      DEMO_MODE: 'false'
      FRONTEND_BASE_URL: ${TALENTMATCH_PUBLIC_URL:?Set TALENTMATCH_PUBLIC_URL to your public HTTPS origin}
      BACKEND_BASE_URL: ${TALENTMATCH_PUBLIC_URL:?Set TALENTMATCH_PUBLIC_URL to your public HTTPS origin}
      CORS_ALLOWED_ORIGINS: '["${TALENTMATCH_PUBLIC_URL:?Set TALENTMATCH_PUBLIC_URL to your public HTTPS origin}"]'
      REDIS_URL: redis://redis:6379/0
