[project]
name = "talentmatch-backend"
version = "0.1.0"
description = "Recruitment API, secure OIDC sessions and durable evaluation worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "authlib>=1.4,<2",
  "python-multipart>=0.0.20,<1", "redis>=5.2,<6", "arq>=0.26,<1",
  "msal>=1.31,<2", "openai>=1.65,<3", "PyMuPDF>=1.25,<2", "python-docx>=1.1,<2",
  "azure-storage-blob>=12.24,<13", "aiohttp>=3.11,<4", "cryptography>=44,<49",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "fakeredis>=2.27,<3", "ruff>=0.11,<1"]
e2e = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
