name: talentmatch

x-runtime: &runtime
  image: talentmatch-backend:phase1
  env_file:
    - path: .env
      required: true
  environment: &runtime-environment
    APP_ENV: production
    DEMO_MODE: 'false'
    FRONTEND_BASE_URL: https://localhost:7242
    BACKEND_BASE_URL: https://localhost:7242
    CORS_ALLOWED_ORIGINS: '["https://localhost:7242"]'
    LINKEDIN_REDIRECT_URI: https://localhost:7242/auth/linkedin/callback
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    LOCAL_RESUME_DIR: /app/data/resumes
    SQLITE_DATABASE_PATH: /app/data/talentmatch.sqlite3
  volumes:
    - portal-data:/app/data
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --save, '60', '1000']
    volumes:
      - queue:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging

  api:
    <<: *runtime
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /app/docker/runtime.py, api-health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *runtime
    command: [python, /app/docker/runtime.py, worker]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /app/docker/runtime.py, worker-health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  web:
    image: talentmatch-web:phase1
    ports:
      - 127.0.0.1:7242:8443
    volumes:
      - ./.certs/server:/etc/talentmatch/tls:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD, wget, -Y, off, --quiet, --spider, http://127.0.0.1:8080/gateway-health]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  queue:
  portal-data:
