# Deliberately log the path only: OAuth callback query strings contain secrets.
log_format portal '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
access_log /dev/stdout portal;
error_log /dev/stderr warn;

server {
    listen 8080;
    server_name localhost;
    location = /gateway-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
    location / { return 301 https://localhost:7242$request_uri; }
}

server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/talentmatch/tls/localhost.pem;
    ssl_certificate_key /etc/talentmatch/tls/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://media.licdn.com https://*.licdn.com; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
    location /auth/ {
        # Upstream errors can otherwise log OAuth code/state query strings.
        # Safe request/stage diagnostics remain available in the API logs.
        error_log /dev/null emerg;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
